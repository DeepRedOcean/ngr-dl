[project]
name = "ngr-dl"
version = "0.1.0"
description = "Deep learning for Nancy Grace Roman telescope data"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.0",
    "photutils>=1.10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "jupyterlab>=4.0",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngr_dl"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true